<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Contas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Cabeçalho Simples -->
    <header class="flex justify-between items-center py-4 mb-4 border-b border-gray-200">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Minhas Contas</h1>
        <p class="text-xs text-gray-500">Controle mensal de vencimentos</p>
      </div>
      <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-4 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1">
        <span class="text-lg leading-none">+</span> Nova Conta
      </button>
    </header>

    <!-- Resumo do Mês -->
    <div class="bg-blue-600 text-white p-5 rounded-2xl shadow-md mb-6">
      <span class="text-xs font-medium opacity-80 uppercase tracking-wider">Total Pendente do Mês</span>
      <div id="totalMes" class="text-3xl font-extrabold mt-1">R$ 0,00</div>
    </div>

    <!-- Lista de Contas -->
    <div id="listaContas" class="space-y-3">
      <!-- Os cartões de contas serão inseridos aqui via JS -->
    </div>
  </div>

  <!-- Modal / Pop-up de Cadastro -->
  <div id="modalConta" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-900">Adicionar Nova Conta</h2>
        <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>

      <form id="formNovaConta" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nome da Conta</label>
          <input type="text" id="nome" placeholder="Ex: Celular, Energia, Máquina" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Valor da Parcela (R$)</label>
          <input type="number" step="0.01" id="valor" placeholder="500.00" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Nº de Parcelas</label>
            <input type="number" id="parcelas" min="1" value="1" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Dia do Vencimento</label>
            <input type="number" id="vencimento" min="1" max="31" placeholder="Ex: 10" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="fecharModal()" class="w-1/2 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl text-sm">Cancelar</button>
          <button type="submit" class="w-1/2 bg-blue-600 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-blue-700">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let contas = JSON.parse(localStorage.getItem('minhas_contas_v2')) || [];

    function abrirModal() {
      document.getElementById('modalConta').classList.remove('hidden');
      document.getElementById('modalConta').classList.add('flex');
    }

    function fecharModal() {
      document.getElementById('modalConta').classList.add('hidden');
      document.getElementById('modalConta').classList.remove('flex');
      document.getElementById('formNovaConta').reset();
    }

    document.getElementById('formNovaConta').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const totalParcelas = parseInt(document.getElementById('parcelas').value);
      const valorParcela = parseFloat(document.getElementById('valor').value);

      const novaConta = {
        id: Date.now(),
        nome: document.getElementById('nome').value,
        valorParcela: valorParcela,
        parcelaAtual: 1,
        totalParcelas: totalParcelas,
        vencimento: parseInt(document.getElementById('vencimento').value),
        pagaNoMes: false
      };

      contas.push(novaConta);
      atualizarTela();
      fecharModal();
    });

    function pagarParcela(id) {
      contas = contas.map(conta => {
        if (conta.id === id) {
          if (conta.parcelaAtual < conta.totalParcelas) {
            return { ...conta, parcelaAtual: conta.parcelaAtual + 1, pagaNoMes: false };
          } else {
            // Se for a última parcela, conclui a conta
            return { ...conta, pagaNoMes: true };
          }
        }
        return conta;
      });
      atualizarTela();
    }

    function excluirConta(id) {
      contas = contas.filter(c => c.id !== id);
      atualizarTela();
    }

    function atualizarTela() {
      localStorage.setItem('minhas_contas_v2', JSON.stringify(contas));
      const container = document.getElementById('listaContas');
      container.innerHTML = '';

      let totalPendenteMes = 0;

      // Ordenar por dia de vencimento
      contas.sort((a, b) => a.vencimento - b.vencimento);

      contas.forEach(conta => {
        const valorTotalConta = conta.valorParcela * conta.totalParcelas;
        const estaConcluidade = conta.pagaNoMes && conta.parcelaAtual === conta.totalParcelas;

        if (!estaConcluidade) {
          totalPendenteMes += conta.valorParcela;
        }

        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl border transition-all ${estaConcluidade ? 'bg-gray-100 border-gray-200 opacity-60' : 'bg-white border-gray-200 shadow-sm'}`;

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-gray-900 text-base">${conta.nome}</h3>
              <p class="text-xs text-gray-500 font-medium">Vence todo dia ${conta.vencimento}</p>
            </div>
            <button onclick="excluirConta(${conta.id})" class="text-gray-300 hover:text-rose-500 text-xs font-bold p-1">✕</button>
          </div>

          <div class="mt-3 flex justify-between items-end">
            <div>
              <div class="text-lg font-extrabold text-gray-900">R$ ${conta.valorParcela.toFixed(2)} <span class="text-xs font-normal text-gray-500">/mês</span></div>
              <div class="text-xs font-semibold text-blue-600 mt-0.5">
                Parcela ${conta.parcelaAtual}/${conta.totalParcelas} • Total: R$ ${valorTotalConta.toFixed(2)}
              </div>
            </div>

            <button onclick="pagarParcela(${conta.id})" ${estaConcluidade ? 'disabled' : ''} 
              class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${estaConcluidade ? 'bg-emerald-100 text-emerald-700' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'}">
              ${estaConcluidade ? 'Quitado ✓' : 'Pagar'}
            </button>
          </div>
        `;

        container.appendChild(card);
      });

      document.getElementById('totalMes').innerText = `R$ ${totalPendenteMes.toFixed(2)}`;
    }

    // Inicializar
    atualizarTela();
  </script>
</body>
</html>
