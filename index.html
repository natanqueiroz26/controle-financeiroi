<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Contas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Cabeçalho Simples -->
    <header class="flex justify-between items-center py-4 mb-4 border-b border-gray-200">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Minhas Contas</h1>
        <p class="text-xs text-gray-500">Controle por mês e vencimentos</p>
      </div>
      <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-4 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1">
        <span class="text-lg leading-none">+</span> Nova Conta
      </button>
    </header>

    <!-- Resumo do Mês -->
    <div class="bg-blue-600 text-white p-5 rounded-2xl shadow-md mb-6">
      <span class="text-xs font-medium opacity-80 uppercase tracking-wider">Total Pendente</span>
      <div id="totalMes" class="text-3xl font-extrabold mt-1">R$ 0,00</div>
    </div>

    <!-- Lista de Contas agrupadas por Mês -->
    <div id="listaContas" class="space-y-6">
      <!-- Inserido dinamicamente via Javascript -->
    </div>
  </div>

  <!-- Modal / Pop-up de Cadastro -->
  <div id="modalConta" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-900">Adicionar Nova Conta</h2>
        <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>

      <form id="formNovaConta" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nome da Conta</label>
          <input type="text" id="nome" placeholder="Ex: Celular, Energia, Máquina" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Valor da Parcela (R$)</label>
          <input type="number" step="0.01" id="valor" placeholder="500.00" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Nº de Parcelas</label>
            <input type="number" id="parcelas" min="1" value="1" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Primeiro Vencimento</label>
            <input type="date" id="dataVencimento" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="fecharModal()" class="w-1/2 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl text-sm">Cancelar</button>
          <button type="submit" class="w-1/2 bg-blue-600 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-blue-700">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let contas = JSON.parse(localStorage.getItem('minhas_contas_v3')) || [];

    function abrirModal() {
      document.getElementById('modalConta').classList.remove('hidden');
      document.getElementById('modalConta').classList.add('flex');
    }

    function fecharModal() {
      document.getElementById('modalConta').classList.add('hidden');
      document.getElementById('modalConta').classList.remove('flex');
      document.getElementById('formNovaConta').reset();
    }

    document.getElementById('formNovaConta').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const totalParcelas = parseInt(document.getElementById('parcelas').value);
      const valorParcela = parseFloat(document.getElementById('valor').value);
      const dataInput = document.getElementById('dataVencimento').value;

      const [ano, mes, dia] = dataInput.split('-');

      const novaConta = {
        id: Date.now(),
        nome: document.getElementById('nome').value,
        valorParcela: valorParcela,
        parcelaAtual: 1,
        totalParcelas: totalParcelas,
        diaVencimento: parseInt(dia),
        mesVencimento: parseInt(mes) - 1, // 0-indexado para JS
        anoVencimento: parseInt(ano),
        concluida: false
      };

      contas.push(novaConta);
      atualizarTela();
      fecharModal();
    });

    function pagarParcela(id) {
      contas = contas.map(conta => {
        if (conta.id === id) {
          if (conta.parcelaAtual < conta.totalParcelas) {
            // Avança para o próximo mês
            let novoMes = conta.mesVencimento + 1;
            let novoAno = conta.anoVencimento;
            if (novoMes > 11) {
              novoMes = 0;
              novoAno += 1;
            }
            return { 
              ...conta, 
              parcelaAtual: conta.parcelaAtual + 1, 
              mesVencimento: novoMes, 
              anoVencimento: novoAno 
            };
          } else {
            // Se for a última parcela, conclui a conta
            return { ...conta, concluida: true };
          }
        }
        return conta;
      });
      atualizarTela();
    }

    function excluirConta(id) {
      contas = contas.filter(c => c.id !== id);
      atualizarTela();
    }

    function atualizarTela() {
      localStorage.setItem('minhas_contas_v3', JSON.stringify(contas));
      const container = document.getElementById('listaContas');
      container.innerHTML = '';

      let totalPendenteGeral = 0;

      // Agrupar por Mês/Ano
      const grupos = {};
      const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

      // Obter data atual para verificar contas vencidas
      const hoje = new Date();
      const mesAtual = hoje.getMonth();
      const anoAtual = hoje.getFullYear();

      // Ordenar por ano e mês
      contas.sort((a, b) => {
        const dataA = new Date(a.anoVencimento, a.mesVencimento, a.diaVencimento);
        const dataB = new Date(b.anoVencimento, b.mesVencimento, b.diaVencimento);
        return dataA - dataB;
      });

      contas.forEach(conta => {
        if (conta.concluida) return;

        totalPendenteGeral += conta.valorParcela;

        const chaveGrupo = `${conta.anoVencimento}-${conta.mesVencimento}`;
        if (!grupos[chaveGrupo]) {
          grupos[chaveGrupo] = {
            titulo: `${nomesMeses[conta.mesVencimento]} de ${conta.anoVencimento}`,
            mes: conta.mesVencimento,
            ano: conta.anoVencimento,
            itens: []
          };
        }
        grupos[chaveGrupo].itens.push(conta);
      });

      // Renderizar grupos
      Object.keys(grupos).forEach(chave => {
        const grupo = grupos[chave];
        
        const blocoMes = document.createElement('div');
        blocoMes.className = 'space-y-3';

        // Título do Mês acima das contas
        const titulo = document.createElement('h2');
        titulo.className = 'text-sm font-bold uppercase tracking-wider text-gray-500 border-b border-gray-200 pb-1';
        titulo.innerText = grupo.titulo;
        blocoMes.appendChild(titulo);

        grupo.itens.forEach(conta => {
          // Verificar se a conta está vencida (mês/ano anterior ao atual)
          const estaVencida = (conta.anoVencimento < anoAtual) || 
                              (conta.anoVencimento === anoAtual && conta.mesVencimento < mesAtual);

          const valorTotalConta = conta.valorParcela * conta.totalParcelas;

          const card = document.createElement('div');
          card.className = `p-4 rounded-2xl border transition-all ${
            estaVencida 
              ? 'bg-rose-50 border-rose-300 shadow-sm' 
              : 'bg-white border-gray-200 shadow-sm'
          }`;

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-gray-900 text-base">${conta.nome}</h3>
                  ${estaVencida ? '<span class="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Vencida</span>' : ''}
                </div>
                <p class="text-xs ${estaVencida ? 'text-rose-600 font-semibold' : 'text-gray-500'} font-medium mt-0.5">
                  Vence dia ${conta.diaVencimento} de ${nomesMeses[conta.mesVencimento]}
                </p>
              </div>
              <button onclick="excluirConta(${conta.id})" class="text-gray-300 hover:text-rose-500 text-xs font-bold p-1">✕</button>
            </div>

            <div class="mt-3 flex justify-between items-end">
              <div>
                <div class="text-lg font-extrabold ${estaVencida ? 'text-rose-700' : 'text-gray-900'}">
                  R$ ${conta.valorParcela.toFixed(2)} <span class="text-xs font-normal text-gray-500">/mês</span>
                </div>
                <div class="text-xs font-semibold text-blue-600 mt-0.5">
                  Parcela ${conta.parcelaAtual}/${conta.totalParcelas} • Total: R$ ${valorTotalConta.toFixed(2)}
                </div>
              </div>

              <button onclick="pagarParcela(${conta.id})" 
                class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm">
                Pagar Parcela
              </button>
            </div>
          `;

          blocoMes.appendChild(card);
        });

        container.appendChild(blocoMes);
      });

      if (Object.keys(grupos).length === 0) {
        container.innerHTML = '<p class="text-center text-sm text-gray-400 py-8">Nenhuma conta pendente no momento!</p>';
      }

      document.getElementById('totalMes').innerText = `R$ ${totalPendenteGeral.toFixed(2)}`;
    }

    // Inicializar
    atualizarTela();
  </script>
</body>
</html>
